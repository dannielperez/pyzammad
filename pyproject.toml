[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyzammad"
version = "0.1.0"
description = "Typed, timeout-bounded Python client for the Zammad REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Danniel Perez" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "requests>=2.32,<3"]

[project.urls]
Repository = "https://github.com/dannielperez/pyzammad"
Issues = "https://github.com/dannielperez/pyzammad/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyzammad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
